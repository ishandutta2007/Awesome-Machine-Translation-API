<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.7" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #58a6ff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #8b949e;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #58a6ff;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { opacity: 0.2; }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-12px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -32; }
    }

    .bg-circle { animation: pulseGlow 5s infinite ease-in-out; }
    .particle { animation: floatParticle 4s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8 8; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Container Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Subtle Dynamic Background Circles -->
  <g class="bg-circle">
    <circle cx="150" cy="80" r="120" fill="#58a6ff" opacity="0.06"/>
    <circle cx="1050" cy="240" r="140" fill="#bc8cff" opacity="0.06"/>
  </g>

  <!-- Dynamic Flow Connecting Lines in Background -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M 80 260 Q 300 290 550 250 T 950 260 T 1120 220" class="flow-line" stroke="#58a6ff" opacity="0.35"/>
    <path d="M 120 280 Q 400 230 680 270 T 1080 240" class="flow-line" stroke="#bc8cff" opacity="0.25"/>
  </g>

  <!-- Flow Data Cards (Translation Illustration in Right Background) -->
  <g transform="translate(760, 165)">
    <rect x="0" y="0" width="165" height="46" rx="8" fill="url(#cardGrad)" stroke="#30363d"/>
    <text x="14" y="27" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#58a6ff">Hello World</text>
    <path d="M 177 23 L 205 23" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="218" y="0" width="165" height="46" rx="8" fill="url(#cardGrad)" stroke="#30363d"/>
    <text x="232" y="27" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#3fb950">Bonjour le monde</text>
  </g>

  <!-- Floating Decorative Particles -->
  <circle cx="180" cy="210" r="4" fill="#58a6ff" class="particle" style="animation-delay: 0s;"/>
  <circle cx="420" cy="250" r="5" fill="#bc8cff" class="particle" style="animation-delay: 1s;"/>
  <circle cx="680" cy="200" r="3" fill="#3fb950" class="particle" style="animation-delay: 2s;"/>
  <circle cx="950" cy="100" r="4" fill="#f0883e" class="particle" style="animation-delay: 1.5s;"/>

  <!-- Foreground Main Content -->
  <g transform="translate(60, 75)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="290" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="18" class="badge-text">🌐 NEURAL MACHINE TRANSLATION APIs</text>

    <!-- Main Title -->
    <text x="0" y="78" class="title">Awesome Machine Translation API</text>

    <!-- Subtitle -->
    <text x="0" y="116" class="subtitle">Curated SaaS Platforms, Self-Hosted Translation Engines &amp; Multilingual NMT Models</text>

    <!-- Feature Highlights -->
    <g transform="translate(0, 144)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7ee787">✓ 10+ SaaS APIs</text>

      <rect x="142" y="0" width="150" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="154" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffa657">✓ Open-Source MT</text>

      <rect x="304" y="0" width="160" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="316" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d2a8ff">✓ Real-time &amp; Batch</text>
    </g>
  </g>
</svg>
