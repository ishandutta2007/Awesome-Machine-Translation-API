<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #c9d1d9; }
    
    /* Background Dynamic Animated Elements */
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.6; transform: scale(1.02); }
      100% { opacity: 0.2; transform: scale(0.98); }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }

    @keyframes dashTranslate {
      to { stroke-dashoffset: -40; }
    }

    .animated-bg-circle { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .particle { animation: floatParticle 4s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8 8; animation: dashTranslate 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic Animated Background Visualizers (Positioned at bottom/sides to avoid obscuring foreground text) -->
  <g class="animated-bg-circle">
    <circle cx="150" cy="80" r="120" fill="#58a6ff" opacity="0.08" filter="url(#glow)"/>
    <circle cx="1050" cy="240" r="140" fill="#bc8cff" opacity="0.08" filter="url(#glow)"/>
  </g>

  <!-- Flow Data Nodes (Background dynamic aspect) -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M 100 250 Q 300 280 500 250 T 900 260 T 1100 230" class="flow-line" stroke="#58a6ff" opacity="0.4"/>
    <path d="M 150 270 Q 400 230 650 270 T 1050 250" class="flow-line" stroke="#bc8cff" opacity="0.3"/>
  </g>

  <!-- Decorative Translation Flow Cards (Bottom Right Background) -->
  <g transform="translate(780, 160)" opacity="0.85">
    <rect x="0" y="0" width="160" height="48" rx="8" fill="url(#cardGrad)" stroke="#30363d"/>
    <text x="16" y="28" font-family="monospace" font-size="14" fill="#58a6ff">Hello World</text>
    <path d="M 175 24 L 205 24" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="220" y="0" width="160" height="48" rx="8" fill="url(#cardGrad)" stroke="#30363d"/>
    <text x="236" y="28" font-family="monospace" font-size="14" fill="#3fb950">Bonjour le monde</text>
  </g>

  <!-- Floating Particles -->
  <circle cx="200" cy="220" r="4" fill="#58a6ff" class="particle" style="animation-delay: 0s;"/>
  <circle cx="450" cy="260" r="6" fill="#bc8cff" class="particle" style="animation-delay: 1s;"/>
  <circle cx="700" cy="210" r="3" fill="#3fb950" class="particle" style="animation-delay: 2s;"/>
  <circle cx="980" cy="110" r="5" fill="#f0883e" class="particle" style="animation-delay: 1.5s;"/>

  <!-- Foreground Content: Title and Subtitle (Crisp & Fully Visible) -->
  <g transform="translate(60, 90)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#232830" stroke="#30363d"/>
    <text x="14" y="18" class="badge-text" fill="#58a6ff">🌐 NEURAL MACHINE TRANSLATION APIs</text>
    
    <!-- Title & Subtitle -->
    <text x="0" y="80" class="title">Awesome Machine Translation API</text>
    <text x="0" y="120" class="subtitle">Curated SaaS Platforms, Self-Hosted Translation Engines & Multilingual NMT Models</text>
    
    <!-- Feature Highlights -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1f242c" stroke="#30363d"/>
      <text x="10" y="17" font-family="-apple-system, sans-serif" font-size="12" fill="#7ee787">✓ 10+ SaaS APIs</text>
      
      <rect x="140" y="0" width="150" height="26" rx="6" fill="#1f242c" stroke="#30363d"/>
      <text x="150" y="17" font-family="-apple-system, sans-serif" font-size="12" fill="#ffa657">✓ Open-Source MT</text>

      <rect x="300" y="0" width="160" height="26" rx="6" fill="#1f242c" stroke="#30363d"/>
      <text x="310" y="17" font-family="-apple-system, sans-serif" font-size="12" fill="#d2a8ff">✓ Real-time &amp; Batch</text>
    </g>
  </g>

</svg>
